name: Check Properties

on:
  workflow_dispatch:
  # Activar después de configurar la URL y los secrets:
  # schedule:
  #   - cron: "*/30 * * * *"

concurrency:
  group: property-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check properties
        env:
          PORTAL_SEARCH_URLS: ${{ secrets.PORTAL_SEARCH_URLS }}
          SEARCH_KEY: busqueda-principal
          ALERT_PRICE_DROPS: ${{ vars.ALERT_PRICE_DROPS || 'true' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python check_properties.py
